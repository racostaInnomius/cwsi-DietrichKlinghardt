name: CMS rebuild (self-hosted → Plesk)

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch: {}

concurrency:
  group: cms-rebuild
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, plesk]
    steps:
      # Asks Plesk to fetch AND deploy, rather than posting to its webhook.
      # The webhook only deploys when the pull brings new commits, so a save
      # in the CMS (content changes, no code) used to reach Plesk, return 2xx
      # and rebuild nothing: the static pages stayed on the old copy until the
      # next code deploy (client, 2026-11-10). `--deploy` always runs the
      # post-deployment action, scripts/plesk-deploy.sh, which builds the
      # site and normalises dist/ permissions itself. The runner lives on the
      # Plesk host as a user with sudo, the same command used by hand.
      - name: Fetch and deploy through Plesk
        run: |
          set -euo pipefail
          umask 022
          sudo plesk ext git --fetch  -domain dietrich-klinghardt.com -name cwsi-dietrich.git
          sudo plesk ext git --deploy -domain dietrich-klinghardt.com -name cwsi-dietrich.git
          echo "Plesk is building the site; dist/ is replaced when it finishes."
