<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <!--
      GLOBAL tags only. Anything page-specific — title, description, canonical,
      og:title/description/url/image — is emitted per route by components/Seo.
      Leaving them here too produced two canonicals on every page, the second
      pointing at "/", which asks search engines to fold the whole site into the
      homepage.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dr. Dietrich Klinghardt" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Kalice Regular carries every heading on every page, so it is worth
         fetching before the CSS that asks for it. Only this one face is
         preloaded: the others are declared in base.css but rarely matched, and
         preloading a font the page never uses wastes the request. -->
    <link
      rel="preload"
      href="/fonts/kalice-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The document title is emitted per route by components/Seo. A static
         one here would become a duplicate on every built page. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
